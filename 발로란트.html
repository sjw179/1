function snap(){const A=window.getAllies(),u4=u=>[u.id,r1(u.position.x),r1(u.position.z),r1(u.rotation.y),Math.round(u.hp)];return{rid:MP.rid,ph,t:Math.round(time),b:r1(bt),sc:score,rn:rnd,w:MP.w,ov:MP.ovf?1:0,sp:SP.on?[r1(SP.x),r1(SP.z),r1(SP.t),r1(SP.dft||0),SP.site=='B'?1:0]:0,bo:bots.map(u4),al:A.filter(u=>u.hp>0).map(u4)}}

const A=window.getAllies(),ids=new Set(S_.al.map(e=>e[0]));S_.al.forEach(e=>{const u=A.find(a=>a.id==e[0]);if(u){if(u.tx==null)u.position.set(e[1],0,e[2]);u.tx=e[1];u.tz=e[2];u.ty=e[3];u.hp=e[4]}});A.forEach(u=>{if(!ids.has(u.id)&&u.hp>0){u.hp=0;u.rotation.x=-1.5}})}
function smooth(arr,dt){const k=Math.min(1,dt*10);arr.forEach(u=>{if(u.tx==null||u.hp<=0)return;const ox=u.position.x,oz=u.position.z;u.position.x+=(u.tx-ox)*k;u.position.z+=(u.tz-oz)*k;const d=u.ty-u.rotation.y;u.rotation.y+=Math.atan2(Math.sin(d),Math.cos(d))*k;const mv=Math.hypot(u.position.x-ox,u.position.z-oz)>.01;u.t+=dt;u.lg[0].rotation.x=mv?Math.sin(u.t*8)*.6:0;u.lg[1].rotation.x=mv?-Math.sin(u.t*8)*.6:0})}

q.forEach(e=>{if(!(e.id>MP.seen[p.peer]))return;MP.seen[p.peer]=e.id;
if(!MP.g){if(e.t=='h'){const b=bots.find(x=>x.id==e.i);window.dmgUx(b,Math.min(200,+e.d||0),{nm:cl(p.presence.n||'친구'),pl:0})}else if(e.t=='p'&&!SP.on&&ph=='play')window.plantAt(['A','B'][e.s?1:0],+e.x||0,+e.z||0)}
else if(e.t=='d'&&e.to==MP.me&&p.presence.host==1)hurt(Math.min(60,+e.d||0),cl(e.by||'적'))})})}

const mv=Math.hypot(u.position.x-ox,u.position.z-oz)>.01&&u.hp>0;u.t+=dt;u.lg[0].rotation.x=mv?Math.sin(u.t*8)*.6:0;u.lg[1].rotation.x=mv?-Math.sin(u.t*8)*.6:0;
if((pr.f||0)>(u.lf||0)){u.lf=pr.f;const e=new THREE.Vector3(u.position.x,1.7,u.position.z),d=new THREE.Vector3(-Math.sin(pr.y)*Math.cos(pr.p||0),Math.sin(pr.p||0),-Math.cos(pr.y)*Math.cos(pr.p||0));tr(e,e.clone().addScaledVector(d,45),0x66ffdd)}});

else if(MP.roster&&ph=='play'&&!SP.on&&P.hp<=0&&!window.getAllies().length&&!MP.alive())endRound(0);
if(now-lastP>60){lastP=now;const o={n:MP.name,pi:window.getSel(),host:MP.host?1:0,x:r1(P.p.x),z:r1(P.p.z),y:Math.round(P.yaw*100)/100,p:Math.round(P.pitch*100)/100,h:Math.max(0,Math.round(P.hp)),f:MP.f};if(MP.host&&MP.roster)o.S=snap();MP.pset(o)}}
